# Icon Store for ZimaOS / CasaOS
# App Store -> "Install a customized app" -> Docker Compose tab -> paste this file.
# Docs: https://github.com/Pyzyi/icon-store  |  Source code: branch "source"
#
# THE ONLY REQUIRED CHANGE: replace ADMIN_KEY below.
# Generate a key in the ZimaOS terminal (openssl is not installed there):
#   head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; echo
# Elsewhere you can also use:  openssl rand -hex 32
# As long as the placeholder is set, the app deliberately refuses to start.
name: icon-store

services:
  # One-shot helper: makes the data folder writable for the unprivileged app user
  # (UID 1000) - also for data from the old version, which is owned by root.
  # Runs with only CHOWN + DAC_READ_SEARCH, without network, and exits immediately.
  icon-store-init:
    image: ghcr.io/pyzyi/icon-store:2
    container_name: icon-store-init
    user: '0:0'
    entrypoint: ['/bin/sh', '-c', 'find /app/data ! -user 1000 -exec chown 1000:1000 {} +']
    restart: 'no'
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ['no-new-privileges:true']
    volumes:
      - type: bind
        source: /DATA/AppData/icon-store/data
        target: /app/data

  icon-store:
    image: ghcr.io/pyzyi/icon-store:2
    container_name: icon-store
    depends_on:
      icon-store-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      # Required, min. 32 characters (see the command at the top).
      ADMIN_KEY: 'CHANGE_ME_generate_a_random_key'
      # Optional (defaults):
      MAX_UPLOAD_MB: '8'
      MAX_TOTAL_SIZE_MB: '1024'
      # Set to "1" only when running behind a reverse proxy (e.g. Nginx Proxy Manager):
      TRUST_PROXY: 'false'
    ports:
      - target: 3000
        published: '3011'
        protocol: tcp
    volumes:
      # Only the data lives on the host; the code is inside the image.
      - type: bind
        source: /DATA/AppData/icon-store/data
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    network_mode: bridge
    labels:
      icon: https://icon.casaos.io/main/all/icon-store.png

x-casaos:
  main: icon-store
  author: self
  category: self
  hostname: ''
  icon: https://icon.casaos.io/main/all/icon-store.png
  index: /
  is_uncontrolled: false
  port_map: '3011'
  scheme: http
  store_app_id: icon-store
  title:
    custom: ''
    en_us: icon-store
    de_de: Icon Store
