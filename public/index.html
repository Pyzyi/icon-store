<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Icon Store</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="nav.skip"></a>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" opacity=".6" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" opacity=".6" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" opacity=".35" />
        </svg>
        <div>
          <h1>Icon Store</h1>
          <p class="tagline" data-i18n="app.tagline"></p>
        </div>
      </div>

      <div class="search-wrap" id="searchWrap" hidden>
        <label for="search" class="visually-hidden" data-i18n="search.label"></label>
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search.placeholder" />
        <span class="search-count" id="searchCount" aria-live="polite"></span>
      </div>

      <nav class="actions" aria-label="Icon Store">
        <button type="button" class="btn btn-accent" id="openUpload" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span data-i18n="nav.upload"></span>
        </button>
        <button type="button" class="btn" id="openBackup" hidden><span data-i18n="nav.backup"></span></button>
        <button type="button" class="btn btn-ghost" id="langToggle" lang="en">EN</button>
        <button type="button" class="btn btn-ghost" id="logout" hidden><span data-i18n="nav.logout"></span></button>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <section id="loginView" class="login" hidden aria-labelledby="loginTitle">
        <form id="loginForm" class="panel" novalidate>
          <h2 id="loginTitle" data-i18n="login.title"></h2>
          <p class="muted" data-i18n="login.hint"></p>
          <label for="loginKey" data-i18n="login.key"></label>
          <input id="loginKey" name="key" type="password" autocomplete="current-password" required />
          <p id="loginError" class="error-text" role="alert"></p>
          <button type="submit" class="btn btn-accent" data-i18n="login.submit"></button>
        </form>
      </section>

      <section id="libraryView" hidden>
        <ul id="grid" class="grid" aria-label="Icons"></ul>
        <p id="noMatch" class="no-match" hidden></p>
        <div id="emptyState" class="empty-state" hidden>
          <h2 data-i18n="empty.title"></h2>
          <p class="muted" data-i18n="empty.text"></p>
          <button type="button" class="btn btn-accent" id="emptyUpload"><span data-i18n="nav.upload"></span></button>
        </div>
        <p id="usage" class="usage muted"></p>
      </section>
    </main>

    <dialog id="uploadDialog" aria-labelledby="uploadTitle">
      <form id="uploadForm" method="dialog" class="dialog-body">
        <h2 id="uploadTitle" data-i18n="upload.title"></h2>
        <div id="dropzone" class="dropzone">
          <p>
            <span data-i18n="upload.drop"></span>
            <label for="fileInput" class="link-button" data-i18n="upload.choose"></label>
          </p>
          <p class="muted small" id="typesHint"></p>
          <input
            id="fileInput"
            type="file"
            multiple
            accept=".png,.svg,.webp,.jpg,.jpeg,.ico,.gif"
            class="visually-hidden"
          />
        </div>
        <ul id="fileList" class="file-list" aria-live="polite"></ul>
        <div class="field" id="nameField">
          <label for="nameInput" data-i18n="upload.name"></label>
          <input id="nameInput" type="text" maxlength="100" placeholder="proxmox" />
        </div>
        <p id="nameMultiHint" class="muted small" data-i18n="upload.nameMulti" hidden></p>
        <div class="field">
          <label for="tagsInput"
            ><span data-i18n="upload.tags"></span> <span class="muted small" data-i18n="upload.tagsHint"></span
          ></label>
          <input id="tagsInput" type="text" placeholder="virtualization, hypervisor" />
        </div>
        <p id="uploadError" class="error-text" role="alert"></p>
        <div class="dialog-foot">
          <button type="button" class="btn" data-close data-i18n="upload.cancel"></button>
          <button type="submit" class="btn btn-accent" id="submitUpload" disabled data-i18n="upload.submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="editDialog" aria-labelledby="editTitle">
      <form id="editForm" method="dialog" class="dialog-body">
        <h2 id="editTitle" data-i18n="edit.title"></h2>
        <div class="field">
          <label for="editName" data-i18n="upload.name"></label>
          <input id="editName" type="text" maxlength="100" required />
        </div>
        <div class="field">
          <label for="editTags"
            ><span data-i18n="upload.tags"></span> <span class="muted small" data-i18n="upload.tagsHint"></span
          ></label>
          <input id="editTags" type="text" />
        </div>
        <p id="editError" class="error-text" role="alert"></p>
        <div class="dialog-foot">
          <button type="button" class="btn" data-close data-i18n="upload.cancel"></button>
          <button type="submit" class="btn btn-accent" data-i18n="edit.save"></button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog" aria-labelledby="deleteTitle" aria-describedby="deleteText">
      <form id="deleteForm" method="dialog" class="dialog-body">
        <h2 id="deleteTitle" data-i18n="delete.title"></h2>
        <p id="deleteText"></p>
        <p id="deleteError" class="error-text" role="alert"></p>
        <div class="dialog-foot">
          <button type="button" class="btn" data-close data-i18n="upload.cancel" autofocus></button>
          <button type="submit" class="btn btn-danger" data-i18n="delete.confirm"></button>
        </div>
      </form>
    </dialog>

    <dialog id="backupDialog" aria-labelledby="backupTitle">
      <div class="dialog-body">
        <h2 id="backupTitle" data-i18n="backup.title"></h2>
        <p class="muted" data-i18n="backup.exportText"></p>
        <a class="btn" href="/api/export" download data-i18n="backup.export"></a>
        <hr />
        <p class="muted" data-i18n="backup.importText"></p>
        <form id="importForm" class="import-row">
          <input id="importFile" type="file" accept=".zip,application/zip" aria-labelledby="importLabel" />
          <button type="submit" class="btn btn-accent" id="importLabel" data-i18n="backup.import"></button>
        </form>
        <p id="importResult" role="status"></p>
        <div class="dialog-foot">
          <button type="button" class="btn" data-close data-i18n="common.close"></button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
